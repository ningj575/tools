services:
  pdf-tools:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MAX_UPLOAD_MB: 250
      GS_BIN: gs
      RENDER_TIMEOUT_MS: 300000
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
